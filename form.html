<!DOCTYPE html>
<html>
<head>
<title>Submit a Name</title>
<meta charset="utf-8">
<style>
  body{font-family:monospace;width:70%;margin:40px auto;padding:0 20px;background:#FFD000}
  h1{font-size:1.5em;color:#000000;padding-bottom:20px;text-align:center}
  input{font-family:monospace;background:#FFF5CB;color:#000;border:1px solid #000;padding:8px 12px;width:50%;display:block}
  input:focus{outline:none;border:1px solid #000;box-shadow:0 0 0 2px #FFD000}
  button{font-family:monospace;background:#000;color:#fff;border:none;padding:8px 18px;cursor:pointer;width:50%;display:block;margin-top:10px}
  #status{color:#000000}
</style>
</head>
<body>
  <h1>BandHorseBeerTeam Submission</h1>
  <input id="entry" type="text" placeholder="Enter a name">
  <button onclick="submitEntry()">Add</button>
  <p id="status"></p>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3CwMGiKimvCkkvFTmktH5HwA0qlK8lqWwlV5UTMrqh4yRDP3KR9twG3p0ThkW1Lbh/exec";

function submitEntry() {
  const input = document.getElementById("entry");
  const status = document.getElementById("status");
  const value = input.value.trim();
  if (!value) return;

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ entry: value })
  })
    .then(() => {
      status.textContent = "Added!";
      input.value = "";
    })
    .catch(err => {
      status.textContent = "Error: " + err.message;
    });
}
</script>
</body>
</html>
