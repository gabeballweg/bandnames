<!DOCTYPE html>
<html>
<head>
<title>GREAT NAMES</title>
<meta charset="utf-8">
<style>
  body{font-family:monospace;width:70%;margin:40px auto;padding:0 20px;background:#FFD000}
  h1{font-size:1.5em;color:#000000;padding-bottom:20px;text-align: center;}
  p{color:#000000}
  #toggle{text-align:center;padding-bottom:20px}
  #toggle button{background:#FFD000;color:#000;border:1px solid #000000;padding:6px 14px;font-family:monospace;cursor:pointer}
  #toggle button.active{background:#000;color:#fff}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
  li {
    background-color: #FFF5CB;
    color:#000;
    padding:8px 12px;
    border: 1px solid #000;
  }
  #randomizer{display:none;background-color:#e1b800;text-align:center;border:1px solid #000000;}
  #randomItem{color:#000000;font-size:4em;padding:80px}
  #randomizer button{background:#000000;color:#fff;padding:8px 18px;font-family:monospace;cursor:pointer}
</style>
</head>
<body>
<h1>Names for your Band, Craft Beer, Racehorse, or Fantasy Football Team</h1>
<p>Observed, stolen, and imagined phrases that have the specific <i>je ne sais quoi</i> of a great name. Use em, tweak em, steal em, laugh at em. 100% human creativity - no AI used, ever.</p>
<div id="toggle">
  <button id="listBtn" class="active" onclick="showView('list')">List View</button>
  <button id="randBtn" onclick="showView('random')">Randomizer</button>
</div>
<ul id="list"></ul>
<div id="randomizer">
  <div id="randomItem"></div>
  <button onclick="showRandom()">Another!</button>
  <p>(or press space)</p>
</div>
<script>
// Paste your published-to-web Google Sheet CSV link below
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxpUoBd3nql6fz7rlwpoFPSp8ahxEO7pLadL-5b5fxbaVpiCTzRg6SwnNCksHeVA8SSCFGSttQ_O8m/pub?gid=0&single=true&output=csv";

let items = [];
let currentView = "list";

fetch(SHEET_CSV_URL)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(text => {
    items = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    document.getElementById("list").innerHTML = items.map(i => `<li>${i}</li>`).join("");
    showRandom();
  })
  .catch(err => {
    document.getElementById("list").innerHTML = "<li>Could not load list: " + err.message + "</li>";
  });

function showView(view) {
  currentView = view;
  document.getElementById("list").style.display = view === "list" ? "flex" : "none";
  document.getElementById("randomizer").style.display = view === "random" ? "block" : "none";
  document.getElementById("listBtn").classList.toggle("active", view === "list");
  document.getElementById("randBtn").classList.toggle("active", view === "random");
}

function showRandom() {
  if (!items.length) return;
  const idx = Math.floor(Math.random() * items.length);
  document.getElementById("randomItem").textContent = items[idx];
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" && currentView === "random") {
    e.preventDefault();
    showRandom();
  }
});
</script>
</body>
</html>
