<!DOCTYPE html>
<html>
<head>
<title>GREAT NAMES</title>
<meta charset="utf-8">
<style>
  body{font-family:monospace;width:70%;margin:40px auto;padding:0 20px;background:#0b0b0b}
  h1{font-size:1.5em;color:#fff;padding-bottom:20px;text-align: center;}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
  li {
    color:#fff;
    padding:8px 12px;
    border-radius:4px
  }
  li:nth-child(7n+1){background:#8C1818}
  li:nth-child(7n+2){background:#188c5e}
  li:nth-child(7n+3){background:#ab5e1b}
  li:nth-child(7n+4){background:#CF8B17}
  li:nth-child(7n+5){background:#9E1B77}
  li:nth-child(7n+6){background:#54188C}
  li:nth-child(7n+7){background:#185a8c}
</style>

</head>
<body>
<h1>Names for your Band, Craft Beer, Racehorse, or Fantasy Football Team</h1>
<p>Observed or imagined phrases that have the specific <i>je ne sais quoi</i> of a great name. Use em, tweak em, steal em, laugh at em. 100% human creativity - no AI used, ever.</p>
<ul id="list"></ul>
<script>
// Paste your published-to-web Google Sheet CSV link below
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxpUoBd3nql6fz7rlwpoFPSp8ahxEO7pLadL-5b5fxbaVpiCTzRg6SwnNCksHeVA8SSCFGSttQ_O8m/pub?gid=0&single=true&output=csv";

fetch(SHEET_CSV_URL)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(text => {
    const items = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    document.getElementById("list").innerHTML = items.map(i => `<li>${i}</li>`).join("");
  })
  .catch(err => {
    document.getElementById("list").innerHTML = "<li>Could not load list: " + err.message + "</li>";
  });
</script>
</body>
</html>
