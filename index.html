<!DOCTYPE html>
<html>
<head>
<title>GREAT NAMES</title>
<meta charset="utf-8">
<style>
  body{font-family:sans-serif;width:80%;margin:40px auto;padding:0 20px;background:#000}
  h1{font-size:1.5em;color:#fff}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
  li {
    color:#fff;
    padding:6px 14px;
    border-radius:8px}
  li:nth-child(7n+1){background:#9E4116}
  li:nth-child(7n+2){background:#106128}
  li:nth-child(7n+3){background:#73143D}
  li:nth-child(7n+4){background:#CF8B17}
</style>

</head>
<body>
<h1>Names for your Band, Fantasy Team, or Craft Beer</h1>
<ul id="list"></ul>
<script>
// Paste your published-to-web Google Sheet CSV link below
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxpUoBd3nql6fz7rlwpoFPSp8ahxEO7pLadL-5b5fxbaVpiCTzRg6SwnNCksHeVA8SSCFGSttQ_O8m/pub?gid=0&single=true&output=csv";

fetch(SHEET_CSV_URL)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(text => {
    const items = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    document.getElementById("list").innerHTML = items.map(i => `<li>${i}</li>`).join("");
  })
  .catch(err => {
    document.getElementById("list").innerHTML = "<li>Could not load list: " + err.message + "</li>";
  });
</script>
</body>
</html>
